[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neat-line-follower-mujoco"
version = "0.1.0"
description = "Reproducible NEAT and PID line-following experiments in MuJoCo"
requires-python = ">=3.11"
dependencies = [
  "mujoco==4.0.0",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "neat-python==0.92",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
plots = ["matplotlib>=3.9,<4"]
gpu = ["mujoco-warp==4.0.0", "warp-lang==1.18.0"]

[project.scripts]
line-follower = "line_follower.__main__:main"

[tool.setuptools.packages.find]
include = ["line_follower*"]

[tool.setuptools.package-data]
line_follower = ["assets/*.xml", "configs/*.json", "configs/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
